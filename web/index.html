<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapAction Web Demo</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        .drop-zone { border: 2px dashed #ccc; border-radius: 12px; padding: 40px 20px; margin: 20px 0; transition: 0.3s; cursor: pointer; }
        .drop-zone:hover, .drop-zone.dragover { border-color: #007AFF; background: #f0f8ff; }
        .capsule { display: none; background: linear-gradient(135deg, #007AFF, #00C6FF); color: white; padding: 12px 24px; border-radius: 50px; font-weight: bold; margin-top: 20px; box-shadow: 0 4px 15px rgba(0,122,255,0.3); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; }
        .hidden { display: none; }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>📸 SnapAction</h1>
    <p>Upload a screenshot to test the Intent Capsule.</p>
    
    <div class="drop-zone" id="dropZone">
        <p>Drop image here or click to upload</p>
        <input type="file" id="fileInput" accept="image/*" hidden>
    </div>
    
    <div id="loading" class="hidden">🧠 Analyzing...</div>
    
    <div id="capsule" class="capsule">
        <!-- Dynamic Content -->
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const capsule = document.getElementById('capsule');
    const loading = document.getElementById('loading');

    dropZone.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
    
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
        if (!file) return;
        
        // Mock Analysis Simulation
        capsule.style.display = 'none';
        loading.classList.remove('hidden');
        
        setTimeout(() => {
            loading.classList.add('hidden');
            analyzeMock(file.name);
        }, 1500);
    }

    function analyzeMock(filename) {
        const name = filename.toLowerCase();
        let text = "✨ Copy Text";
        let icon = "📝";
        
        if (name.includes('shoe') || name.includes('bag')) {
            text = "Find Best Price"; icon = "🛒";
        } else if (name.includes('map') || name.includes('cafe')) {
            text = "Navigate Here"; icon = "📍";
        } else if (name.includes('ticket')) {
            text = "Add to Calendar"; icon = "📅";
        }
        
        capsule.innerHTML = `${icon} ${text}`;
        capsule.style.display = 'inline-block';
    }
</script>

</body>
</html>
